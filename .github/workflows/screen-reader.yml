name: Screen Reader Automation Demo - App A11y - Nexus Demo

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        required: true
        type: choice
        default: testng-android
        options:
          - testng-android
          - testng-ios
          - javascript-android
          - javascript-ios

# Choice labels (Actions UI shows the option values; README maps them):
#   testng-android      → TestNG + Android (TalkBack)
#   testng-ios          → TestNG + iOS (VoiceOver)
#   javascript-android  → WebdriverIO + Android (TalkBack)
#   javascript-ios      → WebdriverIO + iOS (VoiceOver)
#
# Credentials: repo secrets only (BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY).
# workflow_dispatch text inputs are NOT secret — GitHub prints them in the step env:
# block before ::add-mask:: can run, so pasted keys always leak in logs.

jobs:
  screen-reader:
    name: Run ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_APP: ./apps/NexusDemo.apk
      IOS_APP: ./apps/NexusDemo.ipa
      # secrets.* are auto-masked in logs (including the env: dump)
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate credentials and suite
        id: creds
        run: |
          set -euo pipefail

          fail() {
            local msg="$1"
            {
              echo "## Screen reader workflow - input error"
              echo
              echo "**$msg**"
              echo
              echo "Fix: Settings → Secrets and variables → Actions → New repository secret."
              echo "Add \`BROWSERSTACK_USERNAME\` and \`BROWSERSTACK_ACCESS_KEY\`,"
              echo "then Actions → this workflow → Run workflow → pick a suite."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$msg"
            exit 1
          }

          if [ -z "${BROWSERSTACK_USERNAME:-}" ]; then
            fail "Missing secret BROWSERSTACK_USERNAME."
          fi
          if [ -z "${BROWSERSTACK_ACCESS_KEY:-}" ]; then
            fail "Missing secret BROWSERSTACK_ACCESS_KEY."
          fi

          case "${{ inputs.suite }}" in
            testng-android) LABEL="TestNG + Android (TalkBack)"; PROJECT="sca-nexus-app-testng-android" ;;
            testng-ios) LABEL="TestNG + iOS (VoiceOver)"; PROJECT="sca-nexus-app-testng-ios" ;;
            javascript-android) LABEL="WebdriverIO + Android (TalkBack)"; PROJECT="sca-nexus-app-wdio-android" ;;
            javascript-ios) LABEL="WebdriverIO + iOS (VoiceOver)"; PROJECT="sca-nexus-app-wdio-ios" ;;
            *) fail "Unknown suite: ${{ inputs.suite }}" ;;
          esac

          {
            echo "SUITE_LABEL=$LABEL"
            echo "BS_PROJECT=$PROJECT"
          } >> "$GITHUB_ENV"

          {
            echo "## Screen reader run"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Suite | $LABEL (\`${{ inputs.suite }}\`) |"
            echo "| Credentials | repo secrets (auto-masked) |"
            echo "| Status | starting… |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 11
        if: startsWith(inputs.suite, 'testng-')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: |
            app/testng/android/pom.xml
            app/testng/ios/pom.xml

      - name: Set up Node.js 20
        if: startsWith(inputs.suite, 'javascript-')
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/javascript/package-lock.json

      - name: Install JS dependencies
        if: startsWith(inputs.suite, 'javascript-')
        working-directory: app/javascript
        run: npm ci

      - name: Run TestNG Android (TalkBack)
        id: run_testng_android
        if: inputs.suite == 'testng-android'
        working-directory: app/testng/android
        run: mvn -B test

      - name: Run TestNG iOS (VoiceOver)
        id: run_testng_ios
        if: inputs.suite == 'testng-ios'
        working-directory: app/testng/ios
        run: mvn -B test

      - name: Run WebdriverIO Android (TalkBack)
        id: run_js_android
        if: inputs.suite == 'javascript-android'
        working-directory: app/javascript
        run: npm run test:android

      - name: Run WebdriverIO iOS (VoiceOver)
        id: run_js_ios
        if: inputs.suite == 'javascript-ios'
        working-directory: app/javascript
        run: npm run test:ios

      - name: Job summary
        if: always() && steps.creds.outcome == 'success'
        run: |
          set -euo pipefail
          STATUS="failed"
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="passed"
          fi

          {
            echo
            echo "### Result"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Suite | ${SUITE_LABEL} (\`${{ inputs.suite }}\`) |"
            echo "| Outcome | **${STATUS}** |"
            echo "| BrowserStack project | \`${BS_PROJECT}\` |"
            echo "| BrowserStack build | \`browserstack-build-1\` |"
            echo
            echo "### View the screen reader report"
            echo
            echo "1. Open the [App Accessibility dashboard](https://app-accessibility.browserstack.com/)."
            echo "2. Find project **\`${BS_PROJECT}\`**, build **\`browserstack-build-1\`**."
            echo "3. Open the Screen Reader report for this run."
          } >> "$GITHUB_STEP_SUMMARY"
