# Loaded by @wdio/browserstack-service CLI from cwd as browserstack.yml.
# Without this file, App Accessibility sessions stay at srAutomation:false and
# never appear on https://app-accessibility.browserstack.com/screen-reader-automation
userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

framework: wdio
app: ./apps/NexusDemo.ipa

platforms:
  - platformName: ios
    deviceName: iPhone 16
    platformVersion: "18"
    # Required so VoiceOver executors work.
    voiceOver: true

parallelsPerPlatform: 1
browserstackLocal: false
buildName: browserstack-build-1
projectName: sca-nexus-app-javascript-ios
debug: true
networkLogs: true

accessibility: true
accessibilityOptions:
  screenReaderAutomation:
    autoReport: true
    linearNavigation: true
    linearNavigationTimeout: 300000
  wcagVersion: wcag22aa
  includeIssueType:
    bestPractice: false
  scannerProcessingTimeout: 10
